name: Feature request
description: Suggest an improvement for the QLab 5 edition
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the desired user-visible result rather than only an implementation.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
